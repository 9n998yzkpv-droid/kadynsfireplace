name: Update Portfolio Data

on:
  # Rebuild the moment a portfolio input lands on main, so a ledger edit is
  # live in ~2 minutes instead of waiting for the nightly cron (which is
  # weekdays-only, so a Friday edit would otherwise sit until Monday).
  #
  # public/data.json is deliberately NOT in this list: this job commits that
  # file itself, and listing it would make the workflow retrigger itself
  # forever. (GitHub also refuses to trigger workflows from GITHUB_TOKEN
  # pushes, so that is the second of two independent loop guards.)
  push:
    branches: [main]
    paths:
      - 'transactions.json'
      - 'holdings.json'
      - 'pipeline/**'
  schedule:
    # Weekdays at 4:35 PM ET (20:35 UTC standard, 21:35 UTC during DST)
    # Using 21:35 UTC to cover the more common DST period
    - cron: '35 21 * * 1-5'
  workflow_dispatch:

# One run at a time. Without this, a quick series of ledger edits (or an edit
# landing during the nightly run) races two jobs that both commit data.json,
# and the loser's push is rejected. Ledger edits are not cancelled mid-flight
# because the last run is the one whose data.json wins anyway.
concurrency:
  group: update-portfolio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # Fail before touching the dashboard if the ledger math regressed. These
      # are pure-function tests with no network, so they cost ~1s.
      - name: Test ledger engine
        run: python pipeline/test_ledger.py

      - name: Run portfolio pipeline
        # When the Supabase repo secrets are set, positions come from the live
        # DB (managed in the publisher's Portfolio tab); otherwise the pipeline
        # falls back to holdings.json.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python pipeline/run.py

      # When the projects portion launches (PROJECTS_ENABLED=true in
      # src/lib/flags.ts), re-enable the EF dataset refresh:
      #   - name: Bake efficient-frontier dataset
      #     run: python pipeline/ef_universe.py
      # ...and add public/ef-data.json to the `git add` below.

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if git diff --staged --quiet; then
            echo "No changes to data.json"
          else
            git commit -m "Update portfolio data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            # Rebase before pushing: data.json is generated, so if main moved
            # while the pipeline was fetching prices, replaying this commit on
            # top is always correct and avoids a rejected push.
            git pull --rebase --autostash origin main
            git push
          fi
